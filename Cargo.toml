[workspace]
members = ["crates/riftbound-core", "crates/riftbound-runtime"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.87"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
