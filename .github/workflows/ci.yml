name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native audio build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev
      - name: Check browser JavaScript syntax
        run: |
          awk '/^<script>$/ { active = 1; next } index($0, "</script>") { active = 0 } active { print }' index.html > "$RUNNER_TEMP/riftbound.js"
          test -s "$RUNNER_TEMP/riftbound.js"
          node --check "$RUNNER_TEMP/riftbound.js"
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::pedantic
      - name: Run tests
        run: cargo test --workspace
