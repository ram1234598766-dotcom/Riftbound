name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check browser JavaScript syntax
        run: |
          awk '/^<script>$/ { active = 1; next } /<\/script>/ { active = 0 } active { print }' index.html > "$RUNNER_TEMP/riftbound.js"
          test -s "$RUNNER_TEMP/riftbound.js"
          node --check "$RUNNER_TEMP/riftbound.js"
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
